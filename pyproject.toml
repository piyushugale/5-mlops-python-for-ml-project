[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "5-mlops-python-for-ml-project"
version = "0.1.0"
description = "A Python MLOps project for machine learning workflows"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{name = "Your Name", email = "your.email@example.com"}]
keywords = ["mlops", "machine-learning", "python", "data-science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Add your project dependencies here
    # "numpy>=1.21.0",
    # "pandas>=1.3.0",
    # "scikit-learn>=1.0.0",
    # "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
]
test = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]
docs = ["sphinx>=5.0.0", "sphinx-rtd-theme>=1.0.0"]

[project.urls]
Homepage = "https://github.com/yourusername/5-mlops-python-for-ml-project"
Repository = "https://github.com/yourusername/5-mlops-python-for-ml-project.git"

[tool.setuptools]
packages = ["src"]
package-dir = {"" = "src"}

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests as slow"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
disallow_untyped_defs = true

